name: erp-utilities

x-php: &php
  image: erp-utilities-php:dev
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  env_file:
    - .env
    - .env.external
  environment: &php-environment
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:${ERP_HTTP_PORT:-8096}
    DB_CONNECTION: mysql
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    XDEBUG_MODE: ${XDEBUG_MODE:-debug,develop}
    PHP_IDE_CONFIG: serverName=ErpUtilities
  volumes:
    - .:/var/www/html
  extra_hosts:
    - host.docker.internal:host-gateway
  init: true

services:
  app:
    <<: *php
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${ERP_HTTP_PORT:-8096}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - erp-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *php
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=1", "--timeout=120"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  frontend:
    image: erp-utilities-frontend:dev
    build:
      context: .
      dockerfile: docker/php/Dockerfile.frontend
    profiles: ["frontend"]
    working_dir: /var/www/html
    command: ["sh", "-lc", "npm ci --ignore-scripts && npm run setup:ui && npm run dev"]
    volumes:
      - .:/var/www/html
      - erp-node-root:/var/www/html/node_modules
      - erp-node-ui:/var/www/html/packages/ui-kit/quasar/node_modules
      - erp-node-crud:/var/www/html/packages/crud-kit/quasar/node_modules
    init: true

volumes:
  erp-redis:
  erp-node-root:
  erp-node-ui:
  erp-node-crud:
